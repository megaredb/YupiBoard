apply plugin: 'com.android.application'

// Host of the App Links (shared event and profile links, e-mail links) that open in the app.
// It follows VITE_PUBLIC_WEB_URL in the repository root .env, the origin shared links are built
// from, so switching between local testing and the real site is a change in one place.
// A Gradle property wins for one-off builds: gradlew assembleRelease -PappLinkHost=example.com
def appLinkHost = {
    if (project.hasProperty('appLinkHost')) return project.property('appLinkHost')
    def env = rootProject.file('../../.env')
    def line = env.exists() ? env.readLines().find { it.trim().startsWith('VITE_PUBLIC_WEB_URL=') } : null
    if (line == null) {
        throw new GradleException('Set VITE_PUBLIC_WEB_URL in the repository root .env (see frontend/.env.example).')
    }
    return new URI(line.substring(line.indexOf('=') + 1).trim()).host
}()

// Release signing. The upload key stays out of git: its location and passwords come from
// android/keystore.properties (see keystore.properties.example) or ANDROID_KEYSTORE_* variables.
// Without them the release build is left unsigned.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String key, String envName ->
    keystoreProperties.getProperty(key) ?: System.getenv(envName)
}
def releaseStoreFile = signingValue('storeFile', 'ANDROID_KEYSTORE_FILE')

android {
    namespace = "com.yupiboard.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.yupiboard.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [appLinkHost: appLinkHost]
    }
    androidResources {
        // Unlike aapt's default, keeps files starting with "_" that web bundles rely on.
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    signingConfigs {
        // Shared, committed debug key: every developer's debug build has the same SHA-1/SHA-256,
        // so one Google Android OAuth client and one assetlinks.json entry cover the whole team.
        // Debug only; never sign a release with it.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseStoreFile) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig = releaseStoreFile ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
