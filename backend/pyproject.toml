[project]
name = "backend"
version = "0.1.0"
description = "Backend for project"
readme = "README.md"
authors = [{ name = "Yevhen", email = "mredikf@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi-mail>=1.6.8",
    "fastapi[standard]>=0.143.2",
    "google-auth>=2.62.0",
    "greenlet>=3.5.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
